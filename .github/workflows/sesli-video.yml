name: sesli-video
# Elle çalıştırılır: Actions > sesli-video > Run workflow. Gemini ile seslendirir, videoyu senkronlar, mp4'ü "artifact" olarak sunar.
on:
  workflow_dispatch:
    inputs:
      slug: {description: 'icerik klasör adları (boşlukla ayırarak birden fazla: sırayla üretilir)', required: true, default: 'yunan-iki-kare-farki'}
      ses:  {description: 'Ses: tr-TR-AhmetNeural (erkek), tr-TR-EmelNeural (kadın) veya Gemini sesi (Puck, Kore...)', required: true, default: 'tr-TR-AhmetNeural'}
      stil: {description: 'Okuma stili (İngilizce komut; boş bırakılırsa varsayılan enerjik)', required: false, default: ''}
permissions: {contents: write}
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet numpy scipy edge-tts
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save --silent playwright
      - name: Seslendir, senkronla, üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLUGS: ${{ inputs.slug }}
          SES: ${{ inputs.ses }}
          STIL: ${{ inputs.stil }}
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/
        run: |
          set -e
          mkdir -p cikti
          for SLUG in $SLUGS; do
            echo "=== $SLUG ==="
            D="icerik/$SLUG"
            [ -f "$D/ses/metin.txt" ] || { echo "metin.txt yok: $SLUG"; exit 1; }
            case "$SES" in
              tr-TR-*) python3 ses/ahmet_tts.py "$D/ses/metin.txt" "$D/ses" "$SES" ;;
              *) if [ -n "$STIL" ]; then python3 ses/gemini_tts.py "$D/ses/metin.txt" "$D/ses" "$SES" "$STIL"; else python3 ses/gemini_tts.py "$D/ses/metin.txt" "$D/ses" "$SES"; fi ;;
            esac
            python3 ses/senkron.py "$D"
            python3 ses/muzik.py "$D" "$D/ses/ses_gercek.json"
            python3 ses/muzik_dosya.py "$D"
            node panel.mjs render "$SLUG"
            ses/miksaj.sh "$D" kuru "$D/ses/voice.wav"
            cp "$D/final.mp4" "cikti/$SLUG.mp4" && cp "$D/ses/sesler.json" "cikti/$SLUG-sesler.json"
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: videolar
          path: cikti/
      - name: Filigran ekle (hareketli saydam logo)
        run: python3 yayin/filigran.py cikti/*.mp4
      - name: Yayın klasörüne kaydet (main)
        run: |
          git checkout -- icerik
          mkdir -p yayin/video && cp cikti/*.mp4 yayin/video/
          git config user.name "panel-bot" && git config user.email "bot@users.noreply.github.com"
          git add yayin/video
          git diff --cached --quiet || (git commit -q -m "video: yayına hazır" && git pull -q --rebase && git push -q)
      - name: Önizleme dalına yükle (tarayıcıda izlemek için)
        run: |
          mkdir -p /tmp/onizleme && cp cikti/*.mp4 /tmp/onizleme/
          cd /tmp/onizleme
          git init -q -b onizleme
          git config user.name "panel-bot" && git config user.email "bot@users.noreply.github.com"
          git add . && git commit -q -m "önizleme"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" onizleme
