name: yayin
on:
  push:
    branches: [main]
    paths: ['icerik/**/post.json']
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: yayin, cancel-in-progress: false}
jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Onaylı içerikleri yayınla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: node yayin/publish.mjs
      - name: Durumu depoya yaz
        if: always()
        run: |
          git config user.name "panel-bot"; git config user.email "panel-bot@users.noreply.github.com"
          git add icerik/*/post.json
          git diff --cached --quiet || (git commit -m "panel: yayın durumu güncellendi" && git pull --rebase && git push)
