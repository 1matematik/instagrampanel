name: ses-deneme
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg && pip install --quiet edge-tts
      - env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
        run: |
          mkdir -p ses/ornekler
          for V in tr-TR-AhmetNeural en-US-AndrewMultilingualNeural en-US-BrianMultilingualNeural de-DE-FlorianMultilingualNeural fr-FR-RemyMultilingualNeural; do
            python3 ses/ahmet_tts.py ses/deneme/metin.txt /tmp/$V $V +4% && python3 ses/deneme/birlestir.py /tmp/$V ses/ornekler/edge-$V.mp3 || echo "HATA $V"; done
          for V in Charon Puck Orus Algenib; do
            python3 ses/gemini_tts.py ses/deneme/metin.txt /tmp/$V $V && python3 ses/deneme/birlestir.py /tmp/$V ses/ornekler/gemini-$V.mp3 || echo "HATA $V"; done
          ls -la ses/ornekler
          git config user.name bot; git config user.email bot@x; git add ses/ornekler; git commit -qm "Ses örnekleri"; git pull -q --rebase; git push -q
